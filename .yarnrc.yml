nodeLinker: node-modules
enableGlobalCache: false

# @slack/bolt 5 loads @slack/socket-mode 3, which needs `undici` as a peer that
# bolt doesn't declare (slackapi/bolt-js#3039). Yarn doesn't auto-install peers,
# so without this bolt crashes at require time. Drop once bolt declares it.
packageExtensions:
  "@slack/bolt@^5":
    dependencies:
      undici: "^7.30.1"
